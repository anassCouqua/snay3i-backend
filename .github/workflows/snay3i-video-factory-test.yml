name: Snay3i Video Factory v1

on:
  workflow_dispatch:
  push:
    branches:
      - darija-voice-factory
    paths:
      - ".github/workflows/snay3i-video-factory-test.yml"
      - "tools/video_factory/**"
      - "tools/darija_voice/**"

jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/video_factory/requirements.txt

      - name: Install media and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-match "Noto Sans Arabic"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hadra-darija-video-v1-${{ runner.os }}

      - name: Install CPU TTS stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0" "torchaudio==2.8.0"
          pip install "habibi-tts==0.1.1" soundfile huggingface_hub vocos accelerate safetensors
          pip install -r tools/video_factory/requirements.txt
          python - <<'PY'
          import torch, torchaudio
          print("torch", torch.__version__)
          print("torchaudio", torchaudio.__version__)
          assert torch.__version__.startswith("2.8.0")
          assert torchaudio.__version__.startswith("2.8.0")
          PY

      - name: Generate HADRA voice
        run: |
          VOICE_TEXT=$(python - <<'PY'
          import json
          print(json.load(open('tools/video_factory/short_01_plumber.json', encoding='utf-8'))['voice_text'])
          PY
          )
          python tools/darija_voice/generate.py \
            --text "$VOICE_TEXT" \
            --speed "0.93" \
            --output output/snay3i-short-01-voice.wav

      - name: Render 1080x1920 Short
        run: |
          python tools/video_factory/render_short.py \
            --script tools/video_factory/short_01_plumber.json \
            --audio output/snay3i-short-01-voice.wav \
            --output output/snay3i-short-01-plumber-casablanca.mp4
          ffprobe -v error \
            -show_entries stream=width,height,codec_name \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/snay3i-short-01-plumber-casablanca.mp4

      - name: Upload Snay3i Short
        uses: actions/upload-artifact@v4
        with:
          name: snay3i-video-factory-v1-short-01
          path: |
            output/snay3i-short-01-plumber-casablanca.mp4
            output/snay3i-short-01-voice.wav
          retention-days: 7
