name: Snay3i Video Factory v2.3

on:
  workflow_dispatch:
  push:
    branches:
      - darija-voice-factory
    paths:
      - ".github/workflows/snay3i-video-factory-test.yml"
      - "tools/video_factory/**"
      - "tools/darija_voice/**"

jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/video_factory/requirements.txt
      - name: Install media, Arabic shaping and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig libraqm0 libfribidi0 libharfbuzz0b
          fc-match "Noto Sans Arabic"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hadra-darija-v2-${{ runner.os }}
      - name: Install CPU TTS stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0" "torchaudio==2.8.0"
          pip install "habibi-tts==0.1.1" soundfile huggingface_hub vocos accelerate safetensors
          pip install -r tools/video_factory/requirements.txt
          python - <<'PY'
          from PIL import features
          if not features.check('raqm'):
              raise SystemExit('RAQM is required for correct Arabic RTL rendering')
          PY
      - name: Download Snay3i logo and electrician visuals
        run: |
          mkdir -p output/assets
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/anassCouqua/snay3i-frontend/main/public/logo.png" -o output/assets/snay3i-logo.png
          curl -L --fail --retry 3 "https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=1600" -o output/assets/electrician_warning.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8005368/pexels-photo-8005368.jpeg?auto=compress&cs=tinysrgb&w=1600" -o output/assets/electrician_work.jpg
          file output/assets/*
      - name: Generate HADRA voice
        run: |
          VOICE_TEXT=$(python - <<'PY'
          import json
          print(json.load(open('tools/video_factory/short_02_electrician_v2.json', encoding='utf-8'))['voice_text'])
          PY
          )
          python tools/darija_voice/generate.py --text "$VOICE_TEXT" --speed "0.93" --output output/snay3i-short-02-voice.wav
      - name: Render branded premium 1080x1920 Short
        run: |
          python tools/video_factory/render_short_v2.py --script tools/video_factory/short_02_electrician_v2.json --audio output/snay3i-short-02-voice.wav --assets output/assets --logo output/assets/snay3i-logo.png --output output/snay3i-short-02-electrician-v2-3.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration,size -of default=noprint_wrappers=1 output/snay3i-short-02-electrician-v2-3.mp4
      - name: Upload Snay3i v2.3 Short
        uses: actions/upload-artifact@v4
        with:
          name: snay3i-video-factory-v2-3-short-02
          path: |
            output/snay3i-short-02-electrician-v2-3.mp4
            output/snay3i-short-02-voice.wav
            output/assets/snay3i-logo.png
            output/video_factory_v22/scene_*.jpg
          retention-days: 7
